<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспетчер - Підтвердження</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #2a1515;
            border: 1px solid #4a2020;
            border-radius: 12px;
            padding: 20px;
            color: #ff6b6b;
            text-align: center;
        }

        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-new {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
        }

        .status-ready {
            background: rgba(52, 199, 89, 0.2);
            color: #34c759;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
            font-size: 14px;
            flex-shrink: 0;
            width: 100px;
        }

        .info-value {
            color: #fff;
            font-size: 14px;
            text-align: right;
            font-weight: 500;
            word-break: break-word;
        }

        .operator-list {
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }

        .operator-item {
            background: #252525;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .operator-item:hover {
            background: #2a2a2a;
        }

        .operator-item.selected {
            background: rgba(0, 122, 255, 0.1);
            border-color: #007AFF;
        }

        .operator-name {
            font-weight: 500;
            font-size: 16px;
        }

        .operator-status {
            font-size: 12px;
            color: #888;
        }

        .confirm-btn {
            width: 100%;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .confirm-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .confirm-btn:not(:disabled):hover {
            background: #0051D5;
            transform: translateY(-1px);
        }

        .confirm-btn:not(:disabled):active {
            transform: translateY(0);
        }

        .success-message {
            background: rgba(52, 199, 89, 0.2);
            border: 1px solid #34c759;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #34c759;
            margin-top: 20px;
        }

        .success-message h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Диспетчер ПРО</h1>
            <div style="color: #888; font-size: 14px;">Підтвердження заявки</div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Завантаження заявки...</div>
        </div>

        <div id="error" class="error" style="display: none;">
            <div style="font-size: 18px; margin-bottom: 8px;">❌ Помилка</div>
            <div id="error-message"></div>
        </div>

        <div id="content" style="display: none;">
            <!-- Request Info Card -->
            <div class="card">
                <div class="card-title">
                    <span id="request-title">Заявка</span>
                    <span id="status-badge" class="status-badge status-new">🔴 Нова</span>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Тема:</div>
                    <div class="info-value" id="tema">—</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Локація:</div>
                    <div class="info-value" id="location">—</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Дата:</div>
                    <div class="info-value" id="date">—</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Час:</div>
                    <div class="info-value" id="time">—</div>
                </div>
                
                <div class="info-row">
                    <div class="info-label">Журналіст:</div>
                    <div class="info-value" id="journalist">—</div>
                </div>
            </div>

            <!-- Operators Card -->
            <div class="card">
                <div class="card-title">👤 Оберіть оператора</div>
                <div class="operator-list" id="operator-list">
                    <!-- Dynamic operators will be loaded here -->
                </div>
            </div>

            <button id="confirm-btn" class="confirm-btn" disabled>
                Підтвердити заявку
            </button>

            <div id="success" class="success-message" style="display: none;">
                <h3>✅ Заявку підтверджено!</h3>
                <div>Telegram повідомлення оновлено</div>
            </div>
        </div>
    </div>

    <script>
        // NocoDB Configuration
        const NOCODB_API_TOKEN = 'nc_pat_ERmrNABeLtnjeIOMyLwX_4ZCr0s6N35GZcSpNh_A';
        const NOCODB_BASE_ID = 'prxyfx05756id1t';
        const NOCODB_TABLE_REQUESTS = 'mz020c9lrd8vb7o';
        const NOCODB_API_BASE = `https://app.nocodb.com/api/v2/tables/${NOCODB_TABLE_REQUESTS}`;

        // Hardcoded operators list
        const OPERATORS = [
            { name: 'Степанович Петро', status: 'Вільний' },
            { name: 'Наконечний Сергій', status: 'Вільний' },
            { name: 'Поллодюк Олександр', status: 'Вільний' },
            { name: 'Невмержицький Дмитро', status: 'Вільний' }
        ];

        let currentRecordId = null;
        let selectedOperator = null;
        let requestData = null;

        // Get recordId from URL
        const urlParams = new URLSearchParams(window.location.search);
        currentRecordId = urlParams.get('recordId');

        // DOM elements
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const errorMessageEl = document.getElementById('error-message');
        const contentEl = document.getElementById('content');
        const confirmBtn = document.getElementById('confirm-btn');
        const successEl = document.getElementById('success');

        // Show error
        function showError(message) {
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
            errorMessageEl.textContent = message;
        }

        // Load request from NocoDB
        async function loadRequest() {
            if (!currentRecordId) {
                showError('Record ID не вказано в URL. Використовуйте ?recordId=X');
                return;
            }

            try {
                const response = await fetch(`${NOCODB_API_BASE}/rows/${currentRecordId}`, {
                    headers: {
                        'xc-token': NOCODB_API_TOKEN
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                requestData = await response.json();
                
                loadingEl.style.display = 'none';
                contentEl.style.display = 'block';
                
                displayRequest(requestData);
                renderOperators();
                
            } catch (error) {
                console.error('Load error:', error);
                showError(`Не вдалось завантажити заявку: ${error.message}`);
            }
        }

        // Display request data
        function displayRequest(data) {
            document.getElementById('request-title').textContent = data.Назва || 'Заявка';
            document.getElementById('tema').textContent = data.Тема || '—';
            document.getElementById('location').textContent = data.Локація || '—';
            document.getElementById('date').textContent = data.Дата || '—';
            document.getElementById('time').textContent = data.Час || '—';
            document.getElementById('journalist').textContent = data.Журналіст || '—';

            // Update status badge
            const statusBadge = document.getElementById('status-badge');
            if (data.Статус_Заявки === '🟢 Готово') {
                statusBadge.textContent = '🟢 Готово';
                statusBadge.className = 'status-badge status-ready';
                confirmBtn.disabled = true;
                confirmBtn.textContent = 'Заявка вже підтверджена';
            }
        }

        // Render operators list
        function renderOperators() {
            const operatorList = document.getElementById('operator-list');
            operatorList.innerHTML = '';

            OPERATORS.forEach(operator => {
                const item = document.createElement('div');
                item.className = 'operator-item';
                item.innerHTML = `
                    <div>
                        <div class="operator-name
