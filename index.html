<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Диспетчер ПРО</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0c0e;--card:#161618;--card2:#1c1c1f;--border:#26262a;
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,.14);
  --green:#22c55e;--green-dim:rgba(34,197,94,.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,.12);
  --text:#efefef;--sub:#888;--sub2:#444;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.hdr{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:16px;font-weight:700}
.hdr-sub{font-size:11px;color:var(--sub);margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* WRAP */
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}

/* SPINNER */
.spin-box{display:flex;flex-direction:column;align-items:center;padding:80px 0;gap:14px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spin-box p{color:var(--sub);font-size:13px}

/* ERROR */
.err{background:var(--red-dim);border:1px solid rgba(239,68,68,.25);border-radius:14px;padding:22px;text-align:center;margin-top:30px}
.err .ei{font-size:28px;margin-bottom:8px}
.err p{color:var(--red);font-size:13px;line-height:1.5}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);margin-bottom:14px}

/* BADGE */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-new{background:var(--red-dim);color:var(--red)}
.badge-ok{background:var(--green-dim);color:var(--green)}

/* REQUEST INFO */
.req-id{font-size:20px;font-weight:800;margin-bottom:3px}
.req-topic{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:14px;color:var(--text)}
.dt-bar{
  background:linear-gradient(135deg,rgba(59,130,246,.13),rgba(99,102,241,.08));
  border:1px solid rgba(59,130,246,.2);border-radius:13px;
  padding:13px 15px;display:flex;align-items:center;gap:11px;margin-bottom:12px
}
.dt-ico{font-size:22px}
.dt-date{font-size:16px;font-weight:700}
.dt-time{font-size:12px;color:var(--blue);font-weight:600;margin-top:2px}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.info-cell{background:var(--card2);border-radius:11px;padding:11px}
.info-lbl{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.info-val{font-size:13px;font-weight:600}

/* ALREADY CONFIRMED */
.confirmed-bar{
  background:var(--green-dim);border:1px solid rgba(34,197,94,.2);
  border-radius:13px;padding:13px 15px;
  display:flex;align-items:center;gap:11px;margin-bottom:12px
}
.confirmed-bar .ci{font-size:20px}
.confirmed-bar .ct{font-size:13px;font-weight:600;color:var(--green)}
.confirmed-bar .cs{font-size:11px;color:var(--sub);margin-top:2px}

/* OPERATORS */
.ops{display:flex;flex-direction:column;gap:9px}
.op{
  background:var(--card2);border:2px solid var(--border);border-radius:13px;
  padding:13px 15px;display:flex;align-items:center;gap:13px;
  cursor:pointer;transition:border-color .15s,background .15s;
  -webkit-user-select:none;user-select:none
}
.op:active{opacity:.85}
.op.sel{background:var(--blue-dim);border-color:var(--blue)}
.op.busy{opacity:.4;pointer-events:none}
.op-ava{
  width:42px;height:42px;border-radius:50%;background:#222;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;border:2px solid var(--border);transition:border-color .15s
}
.op.sel .op-ava{border-color:var(--blue)}
.op-info{flex:1;min-width:0}
.op-name{font-size:14px;font-weight:600}
.op-st{font-size:11px;margin-top:3px}
.op-st.free{color:var(--green)}
.op-st.occ{color:var(--red)}
.op-chk{
  width:21px;height:21px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s
}
.op.sel .op-chk{background:var(--blue);border-color:var(--blue)}
.chk-svg{display:none}
.op.sel .chk-svg{display:block}

/* BUTTON */
.btn-wrap{margin-top:4px;padding-bottom:20px}
.btn{
  width:100%;background:var(--blue);color:#fff;border:none;
  border-radius:14px;padding:17px;font-size:15px;font-weight:700;
  cursor:pointer;transition:opacity .15s;letter-spacing:-.1px
}
.btn:disabled{background:var(--card2);color:var(--sub);cursor:default}
.btn:not(:disabled):active{opacity:.85}

/* SUCCESS */
.suc{text-align:center;padding:60px 16px}
.suc-ico{width:74px;height:74px;background:var(--green-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px}
.suc h2{font-size:20px;font-weight:800;margin-bottom:8px}
.suc p{color:var(--sub);font-size:13px;line-height:1.6}
.suc-op{margin-top:14px;background:var(--green-dim);border:1px solid rgba(34,197,94,.2);border-radius:11px;padding:11px 15px;font-weight:700;color:var(--green);font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">🎬 Диспетчер ПРО</div>
    <div class="hdr-sub">Підтвердження заявки</div>
  </div>
  <div class="dot"></div>
</div>

<div class="wrap">
  <div id="loading" class="spin-box">
    <div class="spin"></div>
    <p>Завантаження...</p>
  </div>

  <div id="error" style="display:none"></div>

  <div id="main" style="display:none">
    <!-- заявка -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <span class="card-lbl" style="margin:0">Заявка</span>
        <span id="badge" class="badge badge-new">🔴 Нова</span>
      </div>
      <div class="req-id" id="req-id">#—</div>
      <div class="req-topic" id="req-topic">—</div>
      <div class="dt-bar">
        <div class="dt-ico">📅</div>
        <div>
          <div class="dt-date" id="dt-date">—</div>
          <div class="dt-time" id="dt-time">—</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-cell">
          <div class="info-lbl">📍 Локація</div>
          <div class="info-val" id="i-loc">—</div>
        </div>
        <div class="info-cell">
          <div class="info-lbl">🎙 Журналіст</div>
          <div class="info-val" id="i-jour">—</div>
        </div>
      </div>
    </div>

    <!-- вже підтверджено -->
    <div id="conf-bar" class="confirmed-bar" style="display:none">
      <div class="ci">✅</div>
      <div>
        <div class="ct">Оператор призначений</div>
        <div class="cs" id="conf-name">—</div>
      </div>
    </div>

    <!-- вибір оператора -->
    <div class="card" id="ops-card">
      <div class="card-lbl">👤 Оберіть оператора</div>
      <div class="ops" id="ops-list"></div>
    </div>

    <div class="btn-wrap">
      <button class="btn" id="btn" disabled>Підтвердити заявку</button>
    </div>
  </div>

  <div id="success" style="display:none" class="suc">
    <div class="suc-ico">✅</div>
    <h2>Підтверджено!</h2>
    <p>Заявку прийнято.<br>Telegram оновиться автоматично.</p>
    <div class="suc-op" id="suc-op"></div>
  </div>
</div>

<script>
const API  = 'https://app.nocodb.com/api/v1/db/data/noco/prxyfx05756id1t/mz020c9lrd8vb7o';
const TOK  = 'nc_pat_ERmrNABeLtnjeIOMyLwX_4ZCr0s6N35GZcSpNh_A';
const OPS  = [
  {name:'Степанович Петро',    ico:'🎥'},
  {name:'Наконечний Сергій',   ico:'📷'},
  {name:'Поллодюк Олександр',  ico:'🎬'},
  {name:'Невмержицький Дмитро',ico:'📹'},
];

const $  = id => document.getElementById(id);
const p  = new URLSearchParams(location.search);
const id = p.get('recordId');
let sel  = null;

function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
}

function renderOps(busyName){
  const list = $('ops-list');
  list.innerHTML = '';
  OPS.forEach(op=>{
    const busy = busyName && busyName===op.name;
    const el = document.createElement('div');
    el.className = 'op'+(busy?' busy':'');
    el.innerHTML = `
      <div class="op-ava">${op.ico}</div>
      <div class="op-info">
        <div class="op-name">${op.name}</div>
        <div class="op-st ${busy?'occ':'free'}">${busy?'❌ Зайнятий':'✅ Вільний'}</div>
      </div>
      <div class="op-chk">
        <svg class="chk-svg" width="11" height="9" viewBox="0 0 11 9" fill="none">
          <path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`;
    if(!busy) el.addEventListener('click',()=>{
      document.querySelectorAll('.op').forEach(c=>c.classList.remove('sel'));
      el.classList.add('sel');
      sel = op.name;
      $('btn').disabled = false;
    });
    list.appendChild(el);
  });
}

async function load(){
  if(!id){
    $('loading').style.display='none';
    $('error').innerHTML='<div class="err"><div class="ei">⚠️</div><p>Record ID не вказано.<br>Відкрийте посилання з Telegram.</p></div>';
    $('error').style.display='block';
    return;
  }
  try{
    const r = await fetch(`${API}/${id}`,{headers:{'xc-token':TOK}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();

    $('loading').style.display='none';
    $('main').style.display='block';

    $('req-id').textContent  = '#'+(d.Id||id);
    $('req-topic').textContent = d['Тема']||d['Назва']||'—';
    $('dt-date').textContent = fmtDate(d['Дата']);
    $('dt-time').textContent = d['Час']?'о '+d['Час']:'—';
    $('i-loc').textContent   = d['Локація']||'—';
    $('i-jour').textContent  = d['Журналіст']||'—';

    const done = (d['Статус_Заявки']||'').includes('Готово');
    if(done){
      $('badge').textContent  = '🟢 Готово';
      $('badge').className    = 'badge badge-ok';
      const op = d['Operator_FINAL']||d['Operator_LINK']||'';
      if(op){ $('conf-bar').style.display='flex'; $('conf-name').textContent=op; }
      $('btn').disabled=true;
      $('btn').textContent='✅ Вже підтверджено';
    }
    renderOps(done?(d['Operator_LINK']||''):null);

  }catch(e){
    $('loading').style.display='none';
    $('error').innerHTML=`<div class="err"><div class="ei">⚠️</div><p>Помилка: ${e.message}</p></div>`;
    $('error').style.display='block';
  }
}

$('btn').addEventListener('click',async()=>{
  if(!sel) return;
  const btn=$('btn');
  btn.textContent='Підтверджую...'; btn.disabled=true;
  try{
    const r = await fetch(`${API}/${id}`,{
      method:'PATCH',
      headers:{'xc-token':TOK,'Content-Type':'application/json'},
      body:JSON.stringify({'Operator_LINK':sel,'Operator_FINAL':sel,'Статус_Заявки':'🟢 Готово'})
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    $('main').style.display='none';
    $('suc-op').textContent='👤 '+sel;
    $('success').style.display='block';
  }catch(e){
    btn.textContent='Помилка: '+e.message+'. Спробуйте ще.';
    btn.disabled=false;
  }
});

load();
</script>
</body>
</html>
