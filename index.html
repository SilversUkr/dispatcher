<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Диспетчер ПРО</title>
<style>
  :root {
    --bg: #0d0d0f;
    --card: #17171a;
    --card2: #1e1e22;
    --border: #2a2a30;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.15);
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --text: #f0f0f5;
    --muted: #6b6b7a;
    --muted2: #3a3a45;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(180deg, #13131a 0%, var(--bg) 100%);
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .header-top { display:flex; align-items:center; justify-content:space-between; }
  .header h1 { font-size:17px; font-weight:700; letter-spacing:-.3px; }
  .header-sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .live-dot {
    width:8px; height:8px; background:var(--green);
    border-radius:50%; box-shadow:0 0 6px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .content { padding:16px; max-width:600px; margin:0 auto; }
  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; gap:16px; }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading p { color:var(--muted); font-size:14px; }
  .error-box { background:var(--red-bg); border:1px solid rgba(239,68,68,.3); border-radius:14px; padding:24px; text-align:center; margin:40px 0; }
  .error-box .icon { font-size:32px; margin-bottom:8px; }
  .error-box p { color:var(--red); font-size:14px; line-height:1.5; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .card-title { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .badge-new { background:var(--red-bg); color:var(--red); }
  .badge-ready { background:var(--green-bg); color:var(--green); }
  .request-id { font-size:22px; font-weight:800; letter-spacing:-.5px; margin-bottom:4px; }
  .request-topic { font-size:15px; font-weight:500; margin-bottom:14px; line-height:1.4; }
  .datetime-bar {
    background:linear-gradient(135deg, rgba(59,130,246,.15) 0%, rgba(99,102,241,.1) 100%);
    border:1px solid rgba(59,130,246,.25);
    border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .datetime-bar .dt-icon { font-size:24px; }
  .datetime-bar .dt-date { font-size:17px; font-weight:700; }
  .datetime-bar .dt-time { font-size:13px; color:var(--accent); font-weight:600; margin-top:2px; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .info-item { background:var(--card2); border-radius:12px; padding:12px; }
  .info-label { font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
  .info-value { font-size:14px; font-weight:600; }
  .operators-list { display:flex; flex-direction:column; gap:10px; }
  .operator-card {
    background:var(--card2); border:2px solid var(--border);
    border-radius:14px; padding:14px 16px; cursor:pointer;
    transition:all .2s ease; display:flex; align-items:center; gap:14px;
    -webkit-user-select:none; user-select:none;
  }
  .operator-card:active { transform:scale(.98); }
  .operator-card.selected { background:var(--accent-glow); border-color:var(--accent); }
  .operator-card.busy { opacity:.45; cursor:default; }
  .op-avatar {
    width:44px; height:44px;
    background:linear-gradient(135deg,#2d2d35,#1a1a20);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0; border:2px solid var(--border);
    transition:border-color .2s;
  }
  .operator-card.selected .op-avatar { border-color:var(--accent); }
  .op-info { flex:1; min-width:0; }
  .op-name { font-size:15px; font-weight:600; }
  .op-status { font-size:12px; margin-top:3px; }
  .op-status.free { color:var(--green); }
  .op-status.busy-text { color:var(--red); }
  .op-check {
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s;
  }
  .operator-card.selected .op-check { background:var(--accent); border-color:var(--accent); }
  .op-check svg { display:none; }
  .operator-card.selected .op-check svg { display:block; }
  .already-card {
    background:var(--green-bg); border:1px solid rgba(34,197,94,.25);
    border-radius:14px; padding:16px;
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .already-card .aicon { font-size:24px; }
  .already-card .atext { font-size:14px; color:var(--green); font-weight:600; }
  .already-card .asub { font-size:12px; color:var(--muted); margin-top:2px; }
  .confirm-wrap { margin-top:6px; padding-bottom:32px; }
  .confirm-btn {
    width:100%; background:var(--accent); color:#fff;
    border:none; border-radius:16px; padding:18px;
    font-size:16px; font-weight:700; cursor:pointer;
    transition:all .2s; letter-spacing:-.2px;
  }
  .confirm-btn:disabled { background:var(--card2); color:var(--muted); cursor:default; }
  .confirm-btn:not(:disabled):active { transform:scale(.98); opacity:.9; }
  .success-box { text-align:center; padding:60px 20px; }
  .success-icon {
    width:80px; height:80px; background:var(--green-bg);
    border-radius:50%; display:flex; align-items:center;
    justify-content:center; margin:0 auto 20px; font-size:36px;
  }
  .success-box h2 { font-size:22px; font-weight:800; margin-bottom:8px; }
  .success-box p { color:var(--muted); font-size:14px; line-height:1.6; }
  .success-operator {
    margin-top:16px; background:var(--green-bg);
    border:1px solid rgba(34,197,94,.2); border-radius:12px;
    padding:12px 16px; font-weight:700; color:var(--green); font-size:15px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>🎬 Диспетчер ПРО</h1>
      <div class="header-sub">Підтвердження заявки</div>
    </div>
    <span class="live-dot"></span>
  </div>
</div>

<div class="content">

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Завантаження заявки...</p>
  </div>

  <div id="error" style="display:none"></div>

  <div id="content" style="display:none">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Заявка</span>
        <span id="status-badge" class="badge badge-new">🔴 Нова</span>
      </div>
      <div class="request-id" id="request-id">#—</div>
      <div class="request-topic" id="request-topic">—</div>
      <div class="datetime-bar">
        <div class="dt-icon">📅</div>
        <div>
          <div class="dt-date" id="dt-date">—</div>
          <div class="dt-time" id="dt-time">—</div>
        </div>
      </div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">📍 Локація</div>
          <div class="info-value" id="info-location">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">🎙 Журналіст</div>
          <div class="info-value" id="info-journalist">—</div>
        </div>
      </div>
    </div>

    <div id="already-confirmed" class="already-card" style="display:none">
      <div class="aicon">✅</div>
      <div>
        <div class="atext">Оператор призначений</div>
        <div class="asub" id="confirmed-op-name">—</div>
      </div>
    </div>

    <div class="card" id="operators-section">
      <div class="card-header">
        <span class="card-title">👤 Оберіть оператора</span>
      </div>
      <div class="operators-list" id="operator-list"></div>
    </div>

    <div class="confirm-wrap">
      <button class="confirm-btn" id="confirm-btn" disabled>Підтвердити заявку</button>
    </div>
  </div>

  <div id="success" style="display:none" class="success-box">
    <div class="success-icon">✅</div>
    <h2>Підтверджено!</h2>
    <p>Заявку прийнято.<br>Telegram-повідомлення оновиться автоматично.</p>
    <div class="success-operator" id="success-op-name"></div>
  </div>

</div>

<script>
const CFG = {
  token: 'nc_pat_ERmrNABeLtnjeIOMyLwX_4ZCr0s6N35GZcSpNh_A',
  api: 'https://app.nocodb.com/api/v2/tables/mz020c9lrd8vb7o'
};
const OPS = [
  { name: 'Степанович Петро',     icon: '🎥' },
  { name: 'Наконечний Сергій',    icon: '📷' },
  { name: 'Поллодюк Олександр',   icon: '🎬' },
  { name: 'Невмержицький Дмитро', icon: '📹' }
];
const params   = new URLSearchParams(window.location.search);
const recordId = params.get('recordId');
let selectedOp = null;

const $ = id => document.getElementById(id);

function showError(msg) {
  $('loading').style.display = 'none';
  $('error').innerHTML = `<div class="error-box"><div class="icon">⚠️</div><p>${msg}</p></div>`;
  $('error').style.display = 'block';
}

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('uk-UA', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function renderOps(busyName) {
  const list = $('operator-list');
  list.innerHTML = '';
  OPS.forEach(op => {
    const busy = busyName && busyName === op.name;
    const el = document.createElement('div');
    el.className = 'operator-card' + (busy ? ' busy' : '');
    el.innerHTML = `
      <div class="op-avatar">${op.icon}</div>
      <div class="op-info">
        <div class="op-name">${op.name}</div>
        <div class="op-status ${busy ? 'busy-text' : 'free'}">${busy ? '❌ Зайнятий' : '✅ Вільний'}</div>
      </div>
      <div class="op-check">
        <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
          <path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`;
    if (!busy) el.addEventListener('click', () => {
      document.querySelectorAll('.operator-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedOp = op.name;
      $('confirm-btn').disabled = false;
    });
    list.appendChild(el);
  });
}

async function load() {
  if (!recordId) { showError('Record ID не вказано.<br>Відкрийте посилання з Telegram.'); return; }
  try {
    const res = await fetch(`${CFG.api}/rows/${recordId}`, { headers: { 'xc-token': CFG.token } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();

    $('loading').style.display = 'none';
    $('content').style.display = 'block';

    $('request-id').textContent = `#${d.Id || recordId}`;
    $('request-topic').textContent = d['Тема'] || d['Назва'] || '—';
    $('dt-date').textContent = fmtDate(d['Дата']);
    $('dt-time').textContent = d['Час'] ? `о ${d['Час']}` : '—';
    $('info-location').textContent = d['Локація'] || '—';
    $('info-journalist').textContent = d['Журналіст'] || '—';

    const isReady = (d['Статус_Заявки'] || '').includes('Готово');
    if (isReady) {
      $('status-badge').textContent = '🟢 Готово';
      $('status-badge').className = 'badge badge-ready';
      const op = d['Operator_FINAL'] || d['Operator_LINK'] || '';
      if (op) { $('already-confirmed').style.display = 'flex'; $('confirmed-op-name').textContent = op; }
      $('confirm-btn').disabled = true;
      $('confirm-btn').textContent = '✅ Вже підтверджено';
    }
    renderOps(isReady ? (d['Operator_LINK'] || '') : null);
  } catch(e) { showError(`Помилка завантаження: ${e.message}`); }
}

$('confirm-btn').addEventListener('click', async () => {
  if (!selectedOp) return;
  const btn = $('confirm-btn');
  btn.textContent = 'Підтверджую...'; btn.disabled = true;
  try {
    const res = await fetch(`${CFG.api}/rows/${recordId}`, {
      method: 'PATCH',
      headers: { 'xc-token': CFG.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ 'Operator_LINK': selectedOp, 'Operator_FINAL': selectedOp, 'Статус_Заявки': '🟢 Готово' })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    $('content').style.display = 'none';
    $('success-op-name').textContent = `👤 ${selectedOp}`;
    $('success').style.display = 'block';
  } catch(e) {
    btn.textContent = `Помилка: ${e.message}`;
    btn.disabled = false;
  }
});

load();
</script>
</body>
</html>
